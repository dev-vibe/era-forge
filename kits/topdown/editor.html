<title>__GAME_NAME__ Scene Editor</title>
<style>
  /* Layout: full-height workbench. Tool rail left, painting canvas centre, properties and export right; stacks on narrow screens. */
  :root {
    --bg: #eef0f4; --panel: #ffffff; --panel-2: #f4f5f8; --ink: #1c2233; --muted: #5d6679; --line: #d3d8e2;
    --accent: #1f3fa8; --accent-ink: #ffffff; --accent-soft: #dfe6fb; --danger: #b3261e; --canvas: #20232e;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141c; --panel: #1b1f2b; --panel-2: #232838; --ink: #e6e9f2; --muted: #98a0b5; --line: #323950;
      --accent: #8fa8ff; --accent-ink: #0d1330; --accent-soft: #2b3560; --danger: #ff8a80; --canvas: #0c0e14; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141c; --panel: #1b1f2b; --panel-2: #232838; --ink: #e6e9f2; --muted: #98a0b5; --line: #323950;
    --accent: #8fa8ff; --accent-ink: #0d1330; --accent-soft: #2b3560; --danger: #ff8a80; --canvas: #0c0e14; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { height: 100%; display: grid; grid-template-columns: 148px minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: .01em; }
  header .sp { flex: 1; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn:focus-visible, .tool:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tools { background: var(--panel); border-right: 1px solid var(--line); padding: 8px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  .tools h2, .side h2 { margin: 10px 0 4px; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .tools h2:first-child, .side h2:first-child { margin-top: 0; }
  .tool { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; padding: 5px 6px; border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer; }
  .tool:hover { background: var(--panel-2); }
  .tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .tool .sw { width: 11px; height: 11px; border-radius: 2px; flex: none; }
  .tool kbd { margin-left: auto; font: 10.5px var(--mono); color: var(--muted); }
  .vis { display: flex; align-items: center; gap: 6px; padding: 2px 6px; color: var(--muted); font-size: 12px; }
  .stage { position: relative; min-width: 0; min-height: 0; background: var(--canvas); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; pointer-events: none; }
  .hud span { background: rgba(10, 12, 20, .78); color: #e8ecf8; padding: 3px 8px; border-radius: 4px; font: 11.5px var(--mono); }
  .hud .msg { white-space: normal; }
  .empty { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); background: rgba(10, 12, 20, .82); color: #e8ecf8; padding: 6px 12px; border-radius: 6px; text-align: center; pointer-events: none; }
  .side { background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px; overflow: auto; min-width: 0; }
  .row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 8px; align-items: center; margin: 4px 0; }
  .row label { color: var(--muted); font-size: 12px; }
  .row input, .row select, .row textarea { width: 100%; min-width: 0; box-sizing: border-box; padding: 4px 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
  .row textarea { resize: vertical; min-height: 54px; }
  .row .pair { display: flex; gap: 6px; min-width: 0; }
  .num { font-family: var(--mono); }
  .list { max-height: 210px; overflow: auto; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); }
  .list button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 3px 8px; background: none; border: 0; text-align: left; cursor: pointer; }
  .list button:hover { background: var(--accent-soft); }
  .list button[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
  .list .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .list small { margin-left: auto; color: var(--muted); font-family: var(--mono); }
  textarea.io { width: 100%; box-sizing: border-box; height: 120px; font: 11px/1.35 var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px; resize: vertical; }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  @media (max-width: 860px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 60vh auto; }
    .tools { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
    .tools h2 { width: 100%; }
    .tool { width: auto; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>__GAME_NAME__ scene editor</h1>
    <label class="btn" for="imgFile">Load painting…</label>
    <input id="imgFile" type="file" accept="image/*" hidden>
    <button class="btn" id="undoBtn" type="button">Undo</button>
    <button class="btn" id="redoBtn" type="button">Redo</button>
    <button class="btn" id="fitBtn" type="button">Fit view</button>
    <span class="sp"></span>
    <span class="note" id="saveNote" style="margin:0"></span>
  </header>

  <nav class="tools" aria-label="Tools" id="tools"></nav>

  <main class="stage" id="stage">
    <canvas id="cv" tabindex="0" aria-label="Scene painting with traced layers"></canvas>
    <div class="empty" id="emptyNote">Example scene. Drop your own painting here, or use Load painting.</div>
    <div class="hud"><span id="hudPos">x – y –</span><span id="hudZoom">100%</span><span class="msg" id="hudMsg"></span></div>
  </main>

  <aside class="side" id="side">
    <h2>Scene</h2>
    <div class="row"><label for="fId">Id</label><input id="fId" type="text" spellcheck="false"></div>
    <div class="row"><label for="fName">Name</label><input id="fName" type="text"></div>
    <div class="row"><label for="fTW">Size (tiles)</label><div class="pair"><input id="fTW" class="num" type="number" min="1" step="1"><input id="fTH" class="num" type="number" min="1" step="1" readonly title="Derived from the painting's proportions"></div></div>
    <div class="row"><label>Painting</label><span class="num" id="fImg">–</span></div>
    <div class="row"><label for="fGrid">Overlay</label><div class="pair"><label><input id="fGrid" type="checkbox" checked> tiles</label><label><input id="fSnap" type="checkbox"> snap 4px</label><label><input id="fFig" type="checkbox" checked> figure</label></div></div>

    <h2 id="selHead">Selection</h2>
    <div id="props"><p class="note">Nothing selected. Choose Select (V) and click a shape.</p></div>

    <h2>Objects</h2>
    <div class="list" id="objList"></div>

    <h2>Export</h2>
    <p class="note">Save the copied text as <span class="num">assets/game/&lt;id&gt;.scene.json</span> and rebuild; the game picks it up.</p>
    <div class="acts"><button class="btn primary" id="copyBtn" type="button">Copy scene JSON</button><button class="btn" id="selBtn" type="button">Select all text</button></div>
    <textarea class="io" id="outTxt" readonly spellcheck="false" aria-label="Scene JSON"></textarea>

    <h2>Import</h2>
    <textarea class="io" id="inTxt" spellcheck="false" placeholder="Paste a scene JSON here" aria-label="Paste scene JSON"></textarea>
    <div class="acts"><button class="btn" id="loadBtn" type="button">Load JSON</button><button class="btn danger" id="clearBtn" type="button" title="Remove every traced shape">Clear all</button></div>
    <p class="note" id="ioMsg"></p>
  </aside>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('cv'), g = cv.getContext('2d');
  const TILE = 32;                      // logical pixels per tile in the engine
  const HERO_TILES = 1.4;               // a person is about 1.4 tiles tall

  // ---- layer catalogue: key in the scene JSON, how it is drawn, how it is picked ----
  const LAYERS = [
    { id: 'walk',  key: 'walk',   shape: 'poly',  label: 'Walkable',   col: '#30ff70', hot: 'W', hint: 'Click points round the ground the hero may walk on. Click the first point, double-click or press Enter to close.' },
    { id: 'block', key: 'block',  shape: 'rect',  label: 'Blocked',    col: '#ff4060', hot: 'B', hint: 'Drag a rectangle the feet cannot enter (wells, troughs, barrels).' },
    { id: 'occ',   key: 'occ',    shape: 'poly',  label: 'Cut-out',    col: '#ff40ff', hot: 'O', hint: 'Outline something drawn over the hero when his feet are above its baseline (eaves, canopies, roofs).' },
    { id: 'water', key: 'water',  shape: 'poly',  label: 'Water',      col: '#4090ff', hot: 'R', hint: 'Outline a water region (for the water loops later). Bridges over it are cut-outs.' },
    { id: 'door',  key: 'doors',  shape: 'rect',  label: 'Door',       col: '#40e0ff', hot: 'D', hint: 'Drag a trigger rectangle at a doorway.' },
    { id: 'exit',  key: 'exits',  shape: 'rect',  label: 'Exit',       col: '#ffe040', hot: 'E', hint: 'Drag a trigger rectangle along a screen edge. Give it a target scene to link areas.' },
    { id: 'warp',  key: 'warps',  shape: 'rect',  label: 'Warp',       col: '#c080ff', hot: 'X', hint: 'Drag a trigger rectangle. Stepping into it moves the hero to its arrival point (in this scene or another), after a delay, with a sound and an animation. Use Make two-way for a return trigger.' },
    { id: 'thing', key: 'things', shape: 'rect',  label: 'Examine',    col: '#ff9040', hot: 'T', hint: 'Drag a rectangle the hero can look at (well, notice board).' },
    { id: 'light', key: 'lights', shape: 'point', label: 'Light',      col: '#ffd060', hot: 'L', hint: 'Click to place a dusk light (window, lantern, doorway).' },
  ];
  const L_BY = Object.fromEntries(LAYERS.map(l => [l.id, l]));
  const PICK_ORDER = ['light', 'thing', 'warp', 'exit', 'door', 'occ', 'water', 'block', 'walk'];

  // ---- state ----
  let S = emptyScene();
  let img = null, isExample = true;
  let tool = 'select', sel = null, draft = null, drag = null, hover = null;
  let view = { x: 0, y: 0, z: 1 };
  let vis = Object.fromEntries(LAYERS.map(l => [l.id, true])); vis.start = true;
  let hist = [], histAt = -1, dirty = true, panning = null, spaceDown = false;
  const play = { on: false, x: 0, y: 0, dir: 0, mask: null, ww: 0, wh: 0, k: 1, keys: {} };

  function emptyScene() { return { id: 'new_scene', name: 'New scene', img: 'new_scene', iw: 1920, ih: 1080, tiles: [60, 34], start: [960, 600, 0], walk: [], block: [], occ: [], doors: [], exits: [], warps: [], things: [], lights: [], water: [] }; }
  const kScale = () => S.tiles[0] * TILE / S.iw;              // logical px per painting px
  const imgTile = () => S.iw / S.tiles[0];                   // painting px per tile

  // ---- example scene (clearly marked) so the editor opens in a working state ----
  function makeExample() {
    const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const x = c.getContext('2d');
    const gr = x.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, '#6e8a5a'); gr.addColorStop(1, '#4d6b46'); x.fillStyle = gr; x.fillRect(0, 0, 1920, 1080);
    x.fillStyle = '#b79e73'; x.beginPath(); x.moveTo(0, 620); x.lineTo(1920, 560); x.lineTo(1920, 760); x.lineTo(0, 820); x.fill();
    const house = (px, py, w, h) => { x.fillStyle = '#3c3f55'; x.fillRect(px, py, w, h * 0.45); x.fillStyle = '#8a6a4a'; x.fillRect(px, py + h * 0.45, w, h * 0.55); x.fillStyle = '#2a2230'; x.fillRect(px + w * 0.42, py + h * 0.62, w * 0.16, h * 0.38); };
    house(180, 200, 520, 340); house(1180, 160, 560, 380);
    x.fillStyle = '#8f8f9a'; x.fillRect(880, 640, 130, 90); x.fillStyle = '#243a22'; x.beginPath(); x.arc(1560, 880, 140, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.55)'; x.font = '28px system-ui'; x.fillText('EXAMPLE PAINTING (placeholder)', 40, 1050);
    return c;
  }
  function loadExample() {
    img = makeExample(); isExample = true;
    S = emptyScene(); S.id = 'example_street'; S.name = 'Example street'; S.img = 'example_street'; S.tiles = [60, 34]; S.start = [620, 690, 0];
    S.walk = [[[0, 620], [1920, 560], [1920, 760], [0, 820]], [[560, 540], [1040, 540], [1040, 620], [560, 620]]];
    S.block = [[880, 640, 1010, 730]];
    S.occ = [{ name: 'west house', base: 540, poly: [[180, 200], [700, 200], [700, 540], [180, 540]] }, { name: 'east house', base: 540, poly: [[1180, 160], [1740, 160], [1740, 540], [1180, 540]] }];
    S.doors = [{ r: [400, 520, 480, 552], who: '', text: 'The west house door.' }];
    S.exits = [{ r: [1896, 560, 1920, 760], text: 'The road continues east.', to: '', at: [] }];
    S.things = [{ r: [860, 620, 1030, 750], who: '', text: 'A well.' }];
    S.lights = [[440, 420, 50, '#ffb060', 0.4]]; S.water = [{ poly: [[1400, 900], [1800, 900], [1800, 1040], [1400, 1040]], kind: 'pond' }];
    $('emptyNote').hidden = false; afterLoad(true);
  }

  // ---- history ----
  const snap = () => JSON.stringify(S);
  function commit() { hist = hist.slice(0, histAt + 1); hist.push(snap()); if (hist.length > 200) hist.shift(); histAt = hist.length - 1; changed(); }
  function undo() { if (histAt > 0) { S = JSON.parse(hist[--histAt]); fixSel(); changed(); buildProps(); } }
  function redo() { if (histAt < hist.length - 1) { S = JSON.parse(hist[++histAt]); fixSel(); changed(); buildProps(); } }
  function fixSel() { if (sel && !getObj(sel.k, sel.i)) sel = null; }
  let outTimer = 0;
  function changed() { dirty = true; clearTimeout(outTimer); outTimer = setTimeout(() => { $('outTxt').value = exportText(); autosave(); }, 120); buildList(); syncFields(); }
  function autosave() { if (isExample) return; try { localStorage.setItem('__GAME_ID__-scene-editor:' + S.id, snap()); $('saveNote').textContent = 'Autosaved in this browser'; } catch (e) { $('saveNote').textContent = ''; } }

  // ---- object access ----
  function getObj(k, i) { const a = arr(k); return a ? a[i] : undefined; }
  function arr(k) { return S[L_BY[k].key]; }
  function ptsOf(k, i) { const o = getObj(k, i); return k === 'walk' ? o : k === 'occ' || k === 'water' ? o.poly : null; }
  function rectOf(k, i) { const o = getObj(k, i); return k === 'block' ? o : o.r; }

  // ---- geometry ----
  const inPoly = (p, pts) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
  const inRect = (p, r) => p[0] >= r[0] && p[0] <= r[2] && p[1] >= r[1] && p[1] <= r[3];
  function segDist(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy; let t = l ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); }
  const hitR = () => 8 / view.z;
  function pickAt(p) {
    for (const id of PICK_ORDER) { if (!vis[id]) continue; const a = arr(id);
      for (let i = a.length - 1; i >= 0; i--) {
        const L = L_BY[id];
        if (L.shape === 'point') { if (Math.hypot(a[i][0] - p[0], a[i][1] - p[1]) < Math.max(hitR(), 10 / view.z)) return { k: id, i }; }
        else if (L.shape === 'rect') { if (inRect(p, rectOf(id, i))) return { k: id, i }; }
        else if (inPoly(p, ptsOf(id, i))) return { k: id, i };
      } }
    return null;
  }

  // ---- view transform ----
  const toScr = p => [(p[0] - view.x) * view.z, (p[1] - view.y) * view.z];
  const toImg = (sx, sy) => [sx / view.z + view.x, sy / view.z + view.y];
  function fit() { const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return; view.z = Math.min(w / S.iw, h / S.ih) * 0.96; view.x = (S.iw - w / view.z) / 2; view.y = (S.ih - h / view.z) / 2; dirty = true; }
  function resize() { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); dirty = true; }
  const snapP = p => { if ($('fSnap').checked) return [Math.round(p[0] / 4) * 4, Math.round(p[1] / 4) * 4]; return [Math.round(p[0]), Math.round(p[1])]; };
  const clampP = p => [Math.max(0, Math.min(S.iw, p[0])), Math.max(0, Math.min(S.ih, p[1]))];

  // ---- drawing ----
  function pathPoly(pts) { pts.forEach((p, i) => { const s = toScr(p); i ? g.lineTo(s[0], s[1]) : g.moveTo(s[0], s[1]); }); }
  function draw() {
    const d = window.devicePixelRatio || 1; g.setTransform(d, 0, 0, d, 0, 0);
    const w = cv.clientWidth, h = cv.clientHeight; g.clearRect(0, 0, w, h); g.imageSmoothingEnabled = view.z < 1;
    if (img) { const a = toScr([0, 0]); g.drawImage(img, a[0], a[1], S.iw * view.z, S.ih * view.z); }
    if ($('fGrid').checked && view.z * imgTile() > 6) {
      g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1; g.beginPath(); const t = imgTile();
      for (let x = 0; x <= S.iw + 0.5; x += t) { const s = toScr([x, 0])[0]; g.moveTo(s, toScr([0, 0])[1]); g.lineTo(s, toScr([0, S.ih])[1]); }
      for (let y = 0; y <= S.ih + 0.5; y += t) { const s = toScr([0, y])[1]; g.moveTo(toScr([0, 0])[0], s); g.lineTo(toScr([S.iw, 0])[0], s); }
      g.stroke();
    }
    for (const L of LAYERS) { if (!vis[L.id]) continue; const a = arr(L.id);
      a.forEach((o, i) => {
        const isSel = sel && sel.k === L.id && sel.i === i; g.lineWidth = isSel ? 2.5 : 1.5; g.strokeStyle = L.col; g.fillStyle = L.col + (L.id === 'walk' ? '33' : L.id === 'block' ? '44' : '22');
        if (L.shape === 'poly') { const pts = ptsOf(L.id, i); g.beginPath(); pathPoly(pts); g.closePath(); g.fill(); g.stroke();
          if (L.id === 'occ') { const y = toScr([0, o.base])[1]; let x0 = 1e9, x1 = -1e9; pts.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); }); g.save(); g.strokeStyle = '#fff'; g.setLineDash([6, 4]); g.lineWidth = 1.5; g.beginPath(); g.moveTo(toScr([x0, 0])[0], y); g.lineTo(toScr([x1, 0])[0], y); g.stroke(); g.restore(); }
        } else if (L.shape === 'rect') { const r = rectOf(L.id, i), a0 = toScr([r[0], r[1]]), a1 = toScr([r[2], r[3]]); g.fillRect(a0[0], a0[1], a1[0] - a0[0], a1[1] - a0[1]); g.strokeRect(a0[0], a0[1], a1[0] - a0[0], a1[1] - a0[1]);
        } else { const s = toScr(o), rad = o[2] * view.z; g.beginPath(); g.arc(s[0], s[1], Math.max(rad, 4), 0, 7); g.fill(); g.stroke(); g.fillStyle = o[3] || '#ffb060'; g.beginPath(); g.arc(s[0], s[1], 5, 0, 7); g.fill(); g.strokeStyle = '#000'; g.lineWidth = 1; g.stroke(); }
        if (L.shape !== 'point' && (o.name || o.kind || o.text) && (isSel || view.z > 0.45)) { const c = centroid(L.id, i), s = toScr(c); g.font = '11px system-ui'; const t = o.name || o.kind || ''; if (t) { g.fillStyle = 'rgba(10,12,20,.7)'; const tw = g.measureText(t).width; g.fillRect(s[0] - tw / 2 - 3, s[1] - 8, tw + 6, 15); g.fillStyle = '#fff'; g.textAlign = 'center'; g.fillText(t, s[0], s[1] + 3); g.textAlign = 'start'; } }
      }); }
    // warps: a dashed line from each trigger to its arrival point, with a diamond showing where the hero lands and which way he faces
    for (let i = 0; vis.warp && i < S.warps.length; i++) { const o = S.warps[i]; if (!o.at || o.at.length < 2 || (o.to && o.to !== S.id)) continue;
